name: CI

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches:
      - develop
      - testing
      - main
      - "feature/**"
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [ "develop", "testing", "main" ]
    paths-ignore:
      - "**/*.md"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: ${{secrets.DATABASE_URL}}

jobs:
  should-run-on-push:
    name: Detect open PR for branch
    runs-on: ubuntu-latest
    outputs:
      has_pr: ${{ steps.pr.outputs.has_pr }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # On PR events, we don't want to block anything using has_pr
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "has_pr=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "Checking open PRs for branch: $BRANCH"

          PRS=$(gh api \
            repos/${{ github.repository }}/pulls \
            -f state=open \
            -f head=${{ github.repository_owner }}:"$BRANCH" \
            --jq 'length')

          if [ "$PRS" -gt 0 ]; then
            echo "has_pr=true" >> $GITHUB_OUTPUT
          else
            echo "has_pr=false" >> $GITHUB_OUTPUT
          fi

  pre-requisites:
    name: Pre-requisites (setup & install)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  checks:
    name: Checks (lint & typecheck)
    needs:
      - pre-requisites
      - should-run-on-push
    if: |
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'push' &&
        (
          github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/testing' ||
          needs.should-run-on-push.outputs.has_pr == 'false'
        )
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies (uses cache)
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma
        run: pnpm prisma generate

      - name: Linter
        run: pnpm run lint

      - name: TypeScript typecheck
        run: pnpm run typecheck

  ui-tests:
    name: UI Tests
    needs:
      - checks
      - should-run-on-push
    if: |
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'push' &&
        (
          github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/testing' ||
          needs.should-run-on-push.outputs.has_pr == 'false'
        )
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies (uses cache)
        run: pnpm install --frozen-lockfile

      - name: UI tests
        run: pnpm test:ui

  unit-tests:
    name: Unit Tests
    needs:
      - checks
      - should-run-on-push
    if: |
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'push' &&
        (
          github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/testing' ||
          needs.should-run-on-push.outputs.has_pr == 'false'
        )
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies (uses cache)
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Unit tests
        run: pnpm test:unit

  integration-gate:
    name: Decide whether the integration tests should run or not
    runs-on: ubuntu-latest
    needs:
      - should-run-on-push
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Default: don't run
          RUN="false"

          if [ "${{ github.event_name }}" = "push" ]; then
            REF="${{ github.ref }}"

            # Always on main/testing pushes
            if [ "$REF" = "refs/heads/main" ] || [ "$REF" = "refs/heads/testing" ]; then
              RUN="true"
            else
              # Optional on push if no PR open + commit contains [run-it]
              MSG="${{ github.event.head_commit.message }}"
              if [ "${{ needs.should-run-on-push.outputs.has_pr }}" = "false" ] && echo "$MSG" | grep -q "\[run-it\]"; then
                RUN="true"
              fi
            fi

          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            # Run on PR only if LAST commit message contains [run-it]
            PR_NUMBER="${{ github.event.pull_request.number }}"

            LAST_MSG=$(gh api \
              repos/${{ github.repository }}/pulls/$PR_NUMBER/commits \
              --jq '.[-1].commit.message')

            if echo "$LAST_MSG" | grep -q "\[run-it\]"; then
              RUN="true"
            fi
          fi

          echo "run=$RUN" >> $GITHUB_OUTPUT

  integration-tests:
    name: Integration Tests (only push to testing/main)
    needs:
      - checks
      - should-run-on-push
      - integration-gate
    env:
      DATABASE_URL: ${{secrets.DATABASE_URL}}
    if: needs.integration-gate.outputs.run == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: linklite
          POSTGRES_PASSWORD: linklite
          POSTGRES_DB: linklite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U linklite -d linklite_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies (uses cache)
        run: pnpm install --frozen-lockfile

      - name: Install whois (required for WHOIS integration tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y whois
          whois --version || true 

      - name: Generate Prisma
        run: pnpm prisma generate

      - name: Run migrations
        run: pnpm prisma migrate deploy


      - name: Integration tests
        env:
          RUN_WHOIS_INTEGRATION: "1"
        run: pnpm test:integration

  build:
    name: Build (only testing/main)
    needs: checks
    if: |
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/testing' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'pull_request' &&
       (github.base_ref == 'testing' || github.base_ref == 'main'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies (uses cache)
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma
        run: pnpm prisma generate

      - name: Build
        run: pnpm run build # Run build
