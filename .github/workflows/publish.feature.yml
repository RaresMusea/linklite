name: Publish (GHCR pre-dev)

on:
  push:
    branches:
      - "feature/ll-*"

concurrency:
  group: publish-predev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_publish:
    # Only build/push when the HEAD commit has the marker
    if: contains(github.event.head_commit.message, '[build-ghcr-images]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # Use a PAT to read PRs + issue comments reliably (avoids 403)
    # Create secret GH_READ_TOKEN with:
    # - Pull requests: Read
    # - Issues: Read
    # - (optional) Contents: Read
    env:
      GH_TOKEN: ${{ secrets.GH_READ_TOKEN }}

    steps:
      - name: Validate branch name (feature/ll-<number>...)
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${{ github.ref_name }}"

          if [[ ! "$BRANCH" =~ ^feature/ll-[0-9]+ ]]; then
            echo "Branch '$BRANCH' does not match required pattern: feature/ll-<number>..."
            exit 1
          fi

          LL="$(echo "$BRANCH" | sed -nE 's/^feature\/(ll-[0-9]+).*/\1/p')"
          echo "ll=$LL" >> "$GITHUB_OUTPUT"
          echo "Ticket tag: $LL"

      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract PR title + changelog comment (PR -> develop)
        id: prmeta
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_READ_TOKEN }}
        run: |
          set -euo pipefail

          BRANCH="${{ github.ref_name }}"

          # More robust than search/issues for branch names containing slashes.
          # Prefer the most recently updated PR targeting develop for this head branch.
          PR_NUMBER="$(gh pr list \
            --repo "${{ github.repository }}" \
            --head "$BRANCH" \
            --base "develop" \
            --state "all" \
            --json number,updatedAt \
            --jq 'sort_by(.updatedAt) | last | .number // empty' 2>/dev/null || true)"

          PR_NUMBER="$(echo "${PR_NUMBER:-}" | tr -d '[:space:]')"
          echo "Resolved PR_NUMBER='${PR_NUMBER:-}'"

          if ! [[ "${PR_NUMBER:-}" =~ ^[0-9]+$ ]]; then
            echo "No PR found for branch -> develop. Using fallback metadata."
            echo "title=pre-dev build" >> "$GITHUB_OUTPUT"
            echo "desc=pre-dev build triggered by [build-ghcr-images]" >> "$GITHUB_OUTPUT"
            echo "pr_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TITLE="$(gh api "/repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq '.title')"
          PR_URL="$(gh api "/repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq '.html_url')"

          CHANGELOG="$(gh api /repos/${{ github.repository }}/issues/${PR_NUMBER}/comments --paginate \
            --jq '[.[] | select(.body | test("(?i)^Changelog:"))] | last | .body // empty' || true)"

          TITLE_CLEAN="$(echo "$TITLE" | tr '\n' ' ' | sed -E 's/[[:space:]]+/ /g' | cut -c1-200)"

          if [ -z "${CHANGELOG:-}" ]; then
            DESC="$TITLE_CLEAN"
          else
            CHANGELOG_CLEAN="$(echo "$CHANGELOG" | tr '\n' ' ' | sed -E 's/[[:space:]]+/ /g' | cut -c1-500)"
            DESC="${TITLE_CLEAN} - ${CHANGELOG_CLEAN}"
          fi

          # GHCR expects a short OCI description (max 512 chars).
          DESC="$(echo "$DESC" | cut -c1-512)"

          echo "title=$TITLE_CLEAN" >> "$GITHUB_OUTPUT"
          echo "desc=$DESC" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "Computed title: $TITLE_CLEAN"
          echo "Computed description length: $(echo -n "$DESC" | wc -c)"

      - name: Compute tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          BASE="ghcr.io/${OWNER_LC}/linklite"
          SHA="${{ github.sha }}"
          LL="${{ steps.validate.outputs.ll }}"

          echo "app_tags=${BASE}-app:staging-${LL}-${SHA},${BASE}-app:staging-${LL}" >> "$GITHUB_OUTPUT"
          echo "worker_tags=${BASE}-worker:staging-${LL}-${SHA},${BASE}-worker:staging-${LL}" >> "$GITHUB_OUTPUT"
          echo "migrate_tags=${BASE}-migrate:staging-${LL}-${SHA},${BASE}-migrate:staging-${LL}" >> "$GITHUB_OUTPUT"

      - name: Build & push app (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: run
          push: true
          platforms: linux/arm64,linux/amd64
          tags: ${{ steps.tags.outputs.app_tags }}
          labels: |
            org.opencontainers.image.title=${{ steps.prmeta.outputs.title }}
            org.opencontainers.image.description=${{ steps.prmeta.outputs.desc }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.url=${{ steps.prmeta.outputs.pr_url }}
          annotations: |
            index:org.opencontainers.image.title=${{ steps.prmeta.outputs.title }}
            index:org.opencontainers.image.description=${{ steps.prmeta.outputs.desc }}
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.revision=${{ github.sha }}
            index:org.opencontainers.image.version=${{ github.ref_name }}
            index:org.opencontainers.image.url=${{ steps.prmeta.outputs.pr_url }}
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}

      - name: Build & push workers (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker-run
          push: true
          platforms: linux/arm64,linux/amd64
          tags: ${{ steps.tags.outputs.worker_tags }}
          labels: |
            org.opencontainers.image.title=${{ steps.prmeta.outputs.title }}
            org.opencontainers.image.description=${{ steps.prmeta.outputs.desc }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.url=${{ steps.prmeta.outputs.pr_url }}
          annotations: |
            index:org.opencontainers.image.title=${{ steps.prmeta.outputs.title }}
            index:org.opencontainers.image.description=${{ steps.prmeta.outputs.desc }}
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.revision=${{ github.sha }}
            index:org.opencontainers.image.version=${{ github.ref_name }}
            index:org.opencontainers.image.url=${{ steps.prmeta.outputs.pr_url }}
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}

      - name: Build & push migrate (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: true
          platforms: linux/arm64,linux/amd64
          tags: ${{ steps.tags.outputs.migrate_tags }}
          labels: |
            org.opencontainers.image.title=${{ steps.prmeta.outputs.title }}
            org.opencontainers.image.description=${{ steps.prmeta.outputs.desc }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.url=${{ steps.prmeta.outputs.pr_url }}
          annotations: |
            index:org.opencontainers.image.title=${{ steps.prmeta.outputs.title }}
            index:org.opencontainers.image.description=${{ steps.prmeta.outputs.desc }}
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.revision=${{ github.sha }}
            index:org.opencontainers.image.version=${{ github.ref_name }}
            index:org.opencontainers.image.url=${{ steps.prmeta.outputs.pr_url }}
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
