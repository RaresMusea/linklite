services:
  db:
    image: postgres:16
    container_name: linklite-postgres
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.2-alpine
    container_name: linklite-redis
    restart: unless-stopped
    env_file:
      - .env
    command:
      - sh
      - -lc
      - >
        redis-server
        --requirepass "$REDIS_PASSWORD"
        --save ""
        --appendonly no
        --maxmemory 128mb
        --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD-SHELL", "REDISCLI_AUTH=$REDIS_PASSWORD redis-cli ping | grep PONG" ]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      target: migrate
      args:
        DATABASE_URL: ${DATABASE_URL}
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: run
      args:
        DATABASE_URL: ${DATABASE_URL}
    container_name: linklite-app
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  domain-enrichment-worker:
    build:
      context: .
      target: worker-run
      args:
        DATABASE_URL: ${DATABASE_URL}
    container_name: linklite-domain-enrichment-worker
    restart: unless-stopped
    env_file:
      - .env.docker
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: [ "node", "dist/worker/domain_enrichment/domain_enrichment_worker.js" ]

  link-enrichment-worker:
    build:
      context: .
      target: worker-run
      args:
        DATABASE_URL: ${DATABASE_URL}
    container_name: linklite-link-enrichment-worker
    restart: unless-stopped
    env_file:
      - .env.docker
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: [ "node", "dist/worker/link_enrichment/link_enrichment_worker.js" ]

volumes:
  pgdata:
