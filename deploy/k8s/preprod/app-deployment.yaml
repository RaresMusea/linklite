apiVersion: apps/v1
kind: Deployment
metadata:
  name: linklite-app
  namespace: linklite-preprod
  labels:
    app.kubernetes.io/name: linklite
    app.kubernetes.io/component: app
    app.kubernetes.io/environment: preprod
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: linklite
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: linklite
        app.kubernetes.io/component: app
        app.kubernetes.io/environment: preprod
    spec:
      containers:
        - name: app
          image: ghcr.io/raresmusea/linklite-app:testing-current
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "100m"
              memory: "300Mi"
            limits:
              cpu: "800m"
              memory: "768Mi"
          ports:
            - name: http
              containerPort: 3000

          envFrom:
            - configMapRef:
                name: linklite-config
            - secretRef:
                name: linklite-secrets

          readinessProbe:
            httpGet:
              path: /api/app/readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /api/app/healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
