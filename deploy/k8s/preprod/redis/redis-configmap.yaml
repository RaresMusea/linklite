apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: linklite-preprod
data:
  redis.conf: |
    bind 0.0.0.0
    port 6379
    
    # no persistence
    save ""
    appendonly no
    
    # memory cap + eviction prevention
    maxmemory 128mb
    maxmemory-policy allkeys-lru
    
    tcp-keepalive 60
    timeout 0