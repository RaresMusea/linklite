apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: linklite
  namespace: linklite-preprod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - preprod.linklite.dev
      secretName: linklite-origin-tls
  rules:
    - host: preprod.linklite.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: linklite-app
                port:
                  number: 80
