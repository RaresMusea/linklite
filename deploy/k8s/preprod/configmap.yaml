apiVersion: v1
kind: ConfigMap
metadata:
  name: linklite-config
  namespace: linklite-preprod
data:
  APP_ENV: preprod
  LOG_LEVEL: INFO
  LOG_FORMAT: pretty
  RATE_LIMIT_MAX_REQUESTS: "10"
  RATE_LIMIT_WINDOW_SECONDS: "60"
  REDIS_FAIL_STRATEGY: "failOpen"
  BETTER_AUTH_URL: https://preprod.linklite.dev
